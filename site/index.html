<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearthstone DS</title>
  <style>
    :root { color-scheme: light dark; --fundo: #f6f1e7; --texto: #2b2118; --suave: #6b5a48; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #1c1712; --texto: #f3e9d8; --suave: #b9a68c; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto); font: 1rem/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
    p { color: var(--suave); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Hearthstone DS</h1>
    <p>Em construção. O histórico de patches chega no marco M2.</p>
  </main>
</body>
</html>
