<svg xmlns="http://www.w3.org/2000/svg" width="720" height="30" viewBox="0 0 720 30" role="presentation">
  <defs><style>
    .c1{animation:cint 4.2s ease-in-out infinite}.c2{animation:cint 5.6s ease-in-out infinite 1.1s}
    .c3{animation:cint 3.6s ease-in-out infinite 2.2s}.c4{animation:cint 6.4s ease-in-out infinite .5s}
    .e{transform-box:fill-box;transform-origin:center}
    @keyframes cint{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
    .flutua{animation:flutua 7s ease-in-out infinite alternate}
    @keyframes flutua{to{transform:translateY(-7px)}}
    .costura{stroke-dasharray:880;animation:costura 9s var(--s,ease-in-out) infinite}
    @keyframes costura{0%{stroke-dashoffset:880;opacity:1}62%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    .agulha{animation:agulha 9s ease-in-out infinite}
    @keyframes agulha{0%{transform:translateX(0);opacity:1}62%{transform:translateX(880px);opacity:1}72%,100%{transform:translateX(880px);opacity:0}}
    .varre{animation:varre 8s ease-in-out infinite 2s}
    @keyframes varre{0%{transform:translateY(0);opacity:0}6%{opacity:.9}30%{transform:translateY(250px);opacity:.9}36%,100%{transform:translateY(250px);opacity:0}}
    .tremor{animation:tremor 6s steps(1) infinite 2s}
    @keyframes tremor{0%,91%,95.5%,100%{transform:none}92%{transform:translate(-3px,1px)}94%{transform:translate(2px,-1px)}}
    .fa{opacity:0;animation:fa 6s steps(1) infinite 2s}.fb{opacity:0;animation:fb 6s steps(1) infinite 2s}
    @keyframes fa{0%,91%,95.5%,100%{opacity:0;transform:none}92%{opacity:.8;transform:translate(-7px,2px)}94%{opacity:.8;transform:translate(5px,-1px)}}
    @keyframes fb{0%,92%,95.5%,100%{opacity:0;transform:none}92.5%{opacity:.7;transform:translate(6px,-2px)}94.5%{opacity:.7;transform:translate(-4px,1px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.fa,.fb{opacity:0}.costura{stroke-dashoffset:0}}
</style>
