name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[teste]"
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs
