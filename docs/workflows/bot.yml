name: bot

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar Worker e configurar segredos
        id: publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          secrets: |
            TELEGRAM_TOKEN
            TELEGRAM_CHAT_ID
            TELEGRAM_WEBHOOK_SECRET
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

      - name: Registrar webhook e menu de comandos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ steps.publicar.outputs.deployment-url }}
        shell: bash
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "A publicação não informou o endereço do Worker; o webhook não foi alterado."
            exit 1
          fi
          # Chama um método do Telegram e mostra só ok, código e descrição do erro.
          # Nunca imprime a resposta inteira nem a URL, que leva o token.
          chamar_telegram() {
            local metodo="$1"
            shift
            local resposta
            if ! resposta=$(curl -sS --request POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/${metodo}" "$@"); then
              echo "${metodo}: o curl não conseguiu falar com o Telegram."
              return 1
            fi
            if [ -z "${resposta}" ]; then
              echo "${metodo}: o Telegram respondeu vazio."
              return 1
            fi
            printf '%s' "${resposta}" | jq -r --arg metodo "${metodo}" \
              '"\($metodo): ok=\(.ok) código=\(.error_code // "-") descrição=\((.description // "-") | tostring | gsub("[\r\n]"; " "))"' \
              || echo "${metodo}: a resposta do Telegram não era JSON."
            printf '%s' "${resposta}" | jq -e '.ok == true' > /dev/null
          }
          chamar_telegram setWebhook \
            --data-urlencode "url=${WEBHOOK_URL}" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]' \
            --data-urlencode 'drop_pending_updates=true'
          chamar_telegram setMyCommands \
            --data-urlencode 'commands=[{"command":"patch","description":"Último patch ou uma versão"},{"command":"carta","description":"Ficha e mudanças de uma carta"},{"command":"historico","description":"Últimos 10 patches"},{"command":"noticias","description":"Últimas notícias ou uma específica"},{"command":"decks","description":"Links de decks de uma classe"},{"command":"meta","description":"Estatísticas do meta (links)"},{"command":"ajuda","description":"Lista de comandos"}]'
